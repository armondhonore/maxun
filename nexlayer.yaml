application:
  name: maxun
  pods:
  - name: app
    image: maxun/maxun:latest
    path: /
    servicePorts:
    - 8080
    vars:
      POSTGRES_HOST: postgres.pod
      POSTGRES_PORT: "5432"
      POSTGRES_DB: maxun
      POSTGRES_USER: maxun
      POSTGRES_PASSWORD: maxun
      REDIS_HOST: redis.pod
      REDIS_PORT: "6379"
      JWT_SECRET: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
      ENCRYPTION_KEY: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
    volumes:
    - name: maxun-data
      mountPath: /app/uploads
      size: 5Gi
  - name: postgres
    image: postgres:16-alpine
    servicePorts:
    - 5432
    vars:
      POSTGRES_DB: maxun
      POSTGRES_USER: maxun
      POSTGRES_PASSWORD: maxun
    volumes:
    - name: maxun-db
      mountPath: /var/lib/postgresql/data
      size: 5Gi
  - name: redis
    image: redis:7-alpine
    servicePorts:
    - 6379
    volumes:
    - name: maxun-redis
      mountPath: /data
      size: 2Gi
