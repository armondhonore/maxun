application:
  name: maxun
  pods:
  # Single pod: the Maxun frontend (Vite dev server) BUILT FROM SOURCE via the
  # root Dockerfile, so the patched vite.config.js (host=true, allowedHosts=true)
  # is baked in. The prebuilt getmaxun/maxun-frontend image is intentionally NOT
  # used — its unpatched Vite returns 403 "host not allowed" for the Nexlayer
  # public domain. Image name is a local build tag (no upstream match) so the
  # pipeline substitutes the source-built image here.
  - name: app
    image: maxun-ui:latest
    path: /
    servicePorts:
    - 5173
    vars:
      NODE_ENV: "production"
      VITE_PUBLIC_URL: "<% URL %>"
      PUBLIC_URL: "<% URL %>"
      VITE_BACKEND_URL: "<% URL %>/api"
      BACKEND_URL: "<% URL %>/api"
