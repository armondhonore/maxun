application:
  name: maxun
  pods:
  # Single pod: the source-built Maxun frontend image that already contains the
  # patched vite.config.js (host=true, allowedHosts=true). Pinned by its built
  # registry tag so the bot's prebuilt-frontend substitution (which yields a 403
  # "host not allowed" from unpatched Vite) does not apply.
  - name: app
    image: registry.nexlayer.io/user_01kece1xyh817dwff7wnarhkxd/maxun:19f156d7c59
    path: /
    servicePorts:
    - 5173
    vars:
      NODE_ENV: "production"
      VITE_PUBLIC_URL: "<% URL %>"
      PUBLIC_URL: "<% URL %>"
      VITE_BACKEND_URL: "<% URL %>/api"
      BACKEND_URL: "<% URL %>/api"
